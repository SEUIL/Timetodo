spring.application.name=TimeTODO
server.port=${SERVER_PORT:8085}
spring.config.import=optional:file:.env[.properties]

# MySQL JDBC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:timetodo}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate MySQL
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
#none, update, create, create-drop, validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.thymeleaf.cache=false

#spring.thymeleaf.prefix=classpath:/templates/
#spring.thymeleaf.suffix=.html

openai.api.key=${OPENAI_API_KEY:}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}
